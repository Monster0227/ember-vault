<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>余烬地牢 · 全解锁预览</title><style>html,body{margin:0;height:100%;background:#101621;color:#e9ddc7;font-family:Microsoft YaHei,sans-serif}header{height:42px;box-sizing:border-box;padding:10px 16px;background:#263632;font-size:14px}header a{color:#b2e5d5;float:right}iframe{border:0;width:100%;height:calc(100% - 42px);display:block}</style></head><body><header>全解锁预览 · 独立临时存档<a href="/">返回正常游戏</a></header><iframe id="game" title="全解锁游戏预览" allow="fullscreen"></iframe><script>
(async function(){const [html,source]=await Promise.all([fetch('index.html').then(r=>{if(!r.ok)throw Error('页面加载失败');return r.text()}),fetch('js/ember.js').then(r=>{if(!r.ok)throw Error('游戏加载失败');return r.text()})]);
const frame=document.getElementById('game'),doc=frame.contentDocument;doc.open();doc.write(html.replace('<head>','<head><base href="/">').replace(/<script src="js\/ember\.js[^\"]*"><\/script>/,''));doc.close();
const isolated="const localStorage=(()=>{const m={'ember:clears':'4','ember:unlocked':'4','ember:intro-v3':'1','ember:tutorial':'1'};return {getItem:k=>Object.prototype.hasOwnProperty.call(m,k)?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}};})();";
const unlock="window.emberExhibit=true;clears=4;unlocked=4;FOES.forEach(f=>{codex.seen[f.id]=1;codex.kills[f.id]=1;});Object.keys(ITEMS).forEach(id=>{codex.items[id]=1;});LORE.forEach(l=>{codex.lore[l.id]=1;});BLUEPRINTS.forEach(id=>{codex.blue[id]=1;});";
const code=source.replace("  const VERSION=",isolated+"  const VERSION=").replace('  reset(true);applySettings();showMenu();cam=220;',unlock+'\n  reset(true);applySettings();showMenu();cam=220;');if(code===source||!code.includes(unlock))throw Error('当前游戏版本不匹配');const script=doc.createElement('script');script.textContent=code;doc.body.appendChild(script);
})().catch(e=>{document.querySelector('header').textContent='预览加载失败：'+e.message;});
</script></body></html>
