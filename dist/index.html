<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141c29">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="原创横版动作小游戏：三位可选角色、五张各有机关的地图、四位首领与多周目，带着余火敲响沉钟。">
<title>余烬地牢</title>
<link rel="stylesheet" href="css/ember.css?v=5.15">
</head>
<body>
<main id="stage">
<canvas id="world" aria-label="余烬地牢横版动作游戏"></canvas>
<section id="panel" class="veil"></section>
<header id="hud" hidden><div><b>余烬地牢</b><span id="zone">沉钟监牢</span><div class="health" id="health" role="img" aria-label="生命：5 个小幽灵"></div><div id="soul-meter" class="soul-meter" aria-label="魂火：攻击命中积攒，技能花掉"></div><div class="skills" id="skills" aria-label="技能"><button id="sk1" class="sk" data-action="skill1" aria-label="技能一"></button><button id="sk2" class="sk" data-action="skill2" aria-label="技能二"></button><button id="sk3" class="sk" data-action="skill3" aria-label="技能三"></button></div><div class="hud-row"><small id="stats"></small><span id="chips"></span></div><div class="progress" id="progress" aria-hidden="true"><i id="progress-fill"></i></div></div><div class="hud-buttons"><button id="quick-item" class="quick-item" aria-label="当前道具：打开行囊选择"></button><button id="map-btn" aria-label="地图" title="地图"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 11l9-4 8 4 9-4v22l-9 4-8-4-9 4zM16 7v22M24 11v22"/></svg></button><button id="bag-btn" aria-label="行囊：背包、图鉴、传说" title="行囊"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 14h22v20H9zM14 14v-3a6 6 0 0 1 12 0v3M9 22h22M18 20h4v5h-4z"/></svg></button><button id="mute" aria-label="声音开关">声音</button><button id="pause" aria-label="暂停">Ⅱ</button></div><canvas id="minimap" aria-hidden="true"></canvas></header>
<div id="notice" role="status"></div>
<div id="gain" hidden aria-live="polite"><img id="gain-art" alt=""><div><b id="gain-name"></b><small id="gain-info"></small></div></div>
<div id="talk" hidden aria-live="polite"><img id="talk-face" alt="" hidden><b id="talk-who"></b><p id="talk-text"></p><button id="talk-skip" aria-label="跳过本段对话">跳过 ›</button><small class="more" aria-hidden="true">▼</small><small class="auto-tag" aria-hidden="true">自动</small><i id="talk-bar" aria-hidden="true"></i></div>
<nav id="touch" hidden aria-label="触屏操作"><div id="pad" aria-label="摇杆：左右移动；向下加跳跃可穿过悬空平台"><i id="knob"></i></div><button id="heal-btn" class="heal" data-action="heal" aria-label="治疗"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 7h10v7l5 6v18H14V20l5-6zM18 27h12M24 21v12"/></svg><b id="potion-count">1</b></button><button id="item-btn" class="item empty" data-action="use" aria-label="使用道具"><span id="item-name"></span><b id="item-count">0</b></button><button id="chest-btn" class="chest" data-action="interact" hidden>开箱</button><div class="actions"><button id="tsk1" class="sk t1" data-action="skill1" aria-label="技能一"></button><button id="tsk2" class="sk t2" data-action="skill2" aria-label="技能二"></button><button id="tsk3" class="sk t3" data-action="skill3" aria-label="技能三"></button><button class="roll" data-action="roll" aria-label="翻滚"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 29a13 13 0 1 0 3-14M9 10l6 5-6 5M15 31c5 2 14 2 18-3"/></svg></button><button class="jump" data-action="jump" aria-label="跳跃"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 36V10M14 20l10-10 10 10M12 37h24"/></svg></button><button class="attack" data-action="attack" aria-label="攻击"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 37 32 9l7-3-3 8-21 27zM11 30l8 7M9 39l3-3"/></svg></button></div></nav>
<button id="coach-skip" hidden>跳过引导</button>
<footer id="hint" hidden>穿过四章地牢，寻找回家的路。</footer>
</main>
<div id="scene-fade" hidden aria-hidden="true"></div>
<section id="rotate-screen" hidden aria-label="请横屏游玩"><svg viewBox="0 0 120 100" aria-hidden="true"><rect x="27" y="25" width="70" height="43" rx="7"/><path d="M21 46C10 19 40 7 57 13M47 4l12 9-12 8M101 48c12 28-18 43-37 35m10 10-12-10 12-8"/></svg><h1>横过手机，踏入地牢</h1><p>横屏才能看清前方的敌人与落脚点。<br>旋转期间游戏会停住，不会受到伤害。</p><button id="landscape-go">进入横屏</button><small>若没有自动旋转，请关闭手机的方向锁定，再将手机横放。</small></section>
<script src="js/ember.js?v=5.15"></script>
</body>
</html>
